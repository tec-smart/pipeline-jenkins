version: "3.9"

services:

  ########################################################
  # Spring Boot
  ########################################################
  portfolio-api:
    container_name: portfolio-api

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_started

    ports:
      - "${SERVER_PORT}:8080"

    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

    networks:
      - backend

  ########################################################
  # PostgreSQL (Application)
  ########################################################
  postgres:
    image: postgres:17

    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - backend

  ########################################################
  # Redis
  ########################################################
  redis:
    image: redis:8-alpine

    container_name: redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  ########################################################
  # Kafka (KRaft)
  ########################################################
  kafka:
    image: apache/kafka:4.1.0

    container_name: kafka

    restart: unless-stopped

    ports:
      - "${KAFKA_PORT}:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - backend

  ########################################################
  # Kafka UI
  ########################################################
  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: kafka-ui

    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "${KAFKA_UI_PORT}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    networks:
      - backend

  ########################################################
  # Jenkins
  ########################################################
  jenkins:
    image: jenkins/jenkins:lts-jdk21

    container_name: jenkins

    restart: unless-stopped

    ports:
      - "${JENKINS_HTTP_PORT}:8080"
      - "${JENKINS_AGENT_PORT}:50000"

    volumes:
      - jenkins-data:/var/jenkins_home

    networks:
      - backend

  ########################################################
  # PostgreSQL (SonarQube)
  ########################################################
  sonarqube-db:
    image: postgres:17

    container_name: sonarqube-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SONAR_DB_NAME}
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}

    ports:
      - "${SONAR_DB_PORT}:5432"

    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d ${SONAR_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - backend

  ########################################################
  # SonarQube
  ########################################################
  sonarqube:
    image: sonarqube:lts-community

    container_name: sonarqube

    restart: unless-stopped

    depends_on:
      sonarqube-db:
        condition: service_healthy

    ports:
      - "${SONAR_PORT}:9000"

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME}

      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}

      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}

    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

    networks:
      - backend

########################################################
# Networks
########################################################

networks:
  backend:
    driver: bridge

########################################################
# Volumes
########################################################

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  jenkins-data:

  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs: